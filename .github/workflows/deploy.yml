name: Desplegar Blog Astro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Limpiar cache de Astro
        run: npx astro cleanup

      - name: Ejecutar validaciones de contenido y compilación
        run: npm run validate
        env:
          # URL pública de la API propia (Fase 5 de ccd-infra). Sin definir en
          # Actions queda vacía y el sitio publica sin comentarios/métricas.
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          # URL del panel para el enlace «Entrar» del menú. Sin definirla el
          # componente usa el subdominio previsto (panel.culturaydesarrollo.org).
          PUBLIC_PANEL_URL: ${{ vars.PUBLIC_PANEL_URL }}

      - name: Inyectar CNAME institucional
        run: echo "blog.culturaydesarrollo.org" > ./dist/CNAME

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # El sitio sale solo del repo de produccion; en el repo de desarrollo
    # (culturaydesarrollo/ccd_blog-fase45) el job se salta: sin Pages en
    # repos privados y con el CNAME ya apuntando al sitio oficial.
    if: github.repository == 'corporacionculturadesarrollo/ccd_blog'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
